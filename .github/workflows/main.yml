name: Rilable CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            echo "No typecheck script found"
          fi

      - name: Test
        run: |
          if npm run | grep -q "test"; then
            npm test -- --if-present
          else
            echo "No test script found"
          fi

  ios:
    name: iOS
    runs-on: macos-14

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          if ls *.xcodeproj >/dev/null 2>&1; then
            xcodebuild -resolvePackageDependencies
          elif ls *.xcworkspace >/dev/null 2>&1; then
            xcodebuild -resolvePackageDependencies
          else
            echo "No Xcode project/workspace found"
            exit 1
          fi

      - name: List schemes
        run: |
          if ls *.xcworkspace >/dev/null 2>&1; then
            xcodebuild -list -workspace *.xcworkspace
          else
            xcodebuild -list -project *.xcodeproj
          fi
